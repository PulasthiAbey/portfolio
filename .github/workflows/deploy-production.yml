name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production configuration
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel prebuilt output
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to Vercel
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          deploy_log="$RUNNER_TEMP/vercel-deploy.log"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1 | tee "$deploy_log"
          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$deploy_log" | tail -n 1)"

          if [ -z "$deployment_url" ]; then
            echo "Could not determine the Vercel deployment URL from the CLI output." >&2
            exit 1
          fi

          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Publish deployment summary
        if: ${{ success() }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          short_sha="${COMMIT_SHA:0:7}"
          {
            echo "## 🚀 Production Deployment"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | Production |"
            echo "| Commit | \`$short_sha\` |"
            echo "| Deployment | [Open production site]($DEPLOYMENT_URL) |"
            echo
            echo "✅ Production deployment successful"
          } >> "$GITHUB_STEP_SUMMARY"
